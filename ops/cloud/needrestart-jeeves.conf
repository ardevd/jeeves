# Install as /etc/needrestart/conf.d/jeeves.conf on a Jeeves campaign host.
# Keep package updates enabled, but defer their automatic Jeeves restarts.
# Restart Jeeves explicitly only after agents settle and native saves verify.
# needrestart still reports these services as needing a restart.
$nrconf{override_rc}->{qr(^jeeves(?:[-@].*)?\.service$)} = 0;
